<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d19"><title>FIRST WEEK</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#273653,#090d19 65%);color:#f6f8ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:570px;margin:auto;text-align:center;padding:36px 16px 60px}.small{font-size:11px;letter-spacing:.24em;color:#b9c7df}h1{font-size:clamp(36px,9vw,57px);font-weight:600;letter-spacing:.18em;margin:12px 0;text-indent:.18em}.head{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;margin:34px 0 12px}.bar{height:3px;background:#ffffff22;margin-bottom:20px}.fill{height:100%;background:#dbe6ff;width:0;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.tile{aspect-ratio:1;min-width:0;border:1px solid #8ca0c677;border-radius:10px;background:linear-gradient(145deg,#283b58,#101728);color:#f1f5ff;font-size:clamp(25px,7vw,43px);cursor:pointer;text-shadow:0 0 15px #bdccff99;overflow:hidden;padding:0}.tile:active{transform:scale(.95)}.tile:focus-visible{outline:2px solid white;outline-offset:3px}.tile:disabled{cursor:default;opacity:1}.tile img{width:100%;height:100%;object-fit:cover;display:block}.miss{background:radial-gradient(circle,#415479,#111a2b)}.miss span{display:block;animation:twinkle 1.7s infinite alternate}.tile.done{border-color:#d3dfff88}@keyframes twinkle{from{transform:scale(.83) rotate(-8deg);opacity:.5}to{transform:scale(1.13) rotate(8deg);opacity:1}}.help{color:#becbe0;font-size:12px;line-height:2;margin:25px 0}.foot{margin-top:42px;font-size:10px;color:#8f9db6;letter-spacing:.12em}.notice{border:1px solid #53627d;border-radius:14px;padding:24px;margin-top:35px;line-height:1.8}.notice p{font-size:13px;color:#b9c7dc}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#070b17ec;font-size:clamp(38px,11vw,68px);letter-spacing:.13em;text-shadow:0 0 28px #d6e2ff}[hidden]{display:none!important}@media(max-width:350px){.grid{gap:5px}.tile{border-radius:6px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><h1>FIRST WEEK</h1><p class="small">10 TAPS · ONE MORE ROUND</p><section id="game" hidden><div class="head"><span id="sheet"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="grid" id="grid"></div><p class="help">星をタップしてリンク先へ。<br>このページに戻ると星が変化します。<br>10個すべて開くと次のシートへ。</p><p id="status" class="small" role="status"></p></section><section id="notice" class="notice" hidden><h2 id="noticeTitle"></h2><p id="noticeText"></p></section><p class="foot">UNOFFICIAL FAN PROJECT</p></main><div id="overlay" class="overlay" hidden>COMPLETE!</div><script>
(()=>{'use strict';const KEY='starsbase_firstweek_v1',$=id=>document.getElementById(id);let cfg,images=[],state,away=false,finishing=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}};function notice(title,body){$('game').hidden=true;$('notice').hidden=false;$('noticeTitle').textContent=title;$('noticeText').textContent=body}function valid(url){try{let u=new URL(url);return u.protocol==='https:'&&['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname)}catch{return false}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newSheet(){state.sheet++;state.tiles=shuffle(['mv','mv','mv','mv','mv','mv','channel','channel','home','home']).map(type=>({type,done:false,image:null}));state.pending=null;save()}function chooseImage(){if(!images.length)return null;let available=images.filter(i=>!state.used.includes(i));if(!available.length){state.used=[];available=images}let chosen=available[Math.floor(Math.random()*available.length)];state.used.push(chosen);return chosen}function render(){let count=state.tiles.filter(t=>t.done).length;$('game').hidden=false;$('sheet').textContent='SHEET '+String(state.sheet).padStart(3,'0');$('count').textContent=String(count).padStart(2,'0')+' / 10';$('fill').style.width=(count*10)+'%';$('grid').replaceChildren();state.tiles.forEach((t,i)=>{let b=document.createElement('button');b.className='tile'+(t.done?' done':'')+(t.done&&t.type!=='mv'?' miss':'');b.type='button';b.disabled=t.done;b.setAttribute('aria-label',(i+1)+'番目の星'+(t.done?' 開封済み':''));if(t.done&&t.image){let img=document.createElement('img');img.src=t.image;img.alt='FIRST WEEK';img.onerror=()=>{img.remove();b.textContent='✧'};b.append(img)}else{let s=document.createElement('span');s.textContent=t.done&&t.type==='mv'?'✧':'★';b.append(s)}b.onclick=()=>open(i);$('grid').append(b)})}function finishTile(i){let t=state.tiles[i];if(!t||t.done)return;t.done=true;if(t.type==='mv')t.image=chooseImage();state.pending=null;save();render();if(state.tiles.every(t=>t.done))finishSheet()}function finishSheet(){if(finishing)return;finishing=true;$('overlay').hidden=false;setTimeout(()=>{newSheet();$('overlay').hidden=true;finishing=false;render()},1700)}function open(i){if(state.pending||finishing)return;let t=state.tiles[i],url=t.type==='mv'?cfg.mvUrl:t.type==='channel'?cfg.channelUrl:'https://www.youtube.com/';if(!valid(url))return;$('status').textContent='';state.pending={i,at:Date.now()};save();away=true;location.assign(url)}function returned(){if(!state?.pending||finishing)return;if(Date.now()-state.pending.at<500)return;finishTile(state.pending.i);away=false}async function load(path){let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return r.json()}async function init(){try{cfg=await load('./config.json');let now=Date.now(),start=cfg.startAt?Date.parse(cfg.startAt):null,end=cfg.endAt?Date.parse(cfg.endAt):null;if(cfg.enabled===false)return notice('CLOSED','FIRST WEEKは現在公開されていません。');if(start&&now<start)return notice('COMING SOON','開催までお待ちください。');if(end&&now>=end)return notice('FIRST WEEK ENDED','開催期間は終了しました。ご参加ありがとうございました。');if(!valid(cfg.mvUrl)||!valid(cfg.channelUrl))return notice('PREPARING','リンク先を準備しています。');let imageData=await load('https://starsbase-artist-admin.starsx0601.workers.dev/api/first-week/images');let list=imageData?.images;images=Array.isArray(list)?[...new Set(list.filter(x=>{if(typeof x!=='string')return false;try{let u=new URL(x);return u.protocol==='https:'&&u.origin==='https://starsbase-artist-admin.starsx0601.workers.dev'&&u.pathname==='/api/first-week/images/file'}catch{return false}}))]:[];let old=read(),id=String(cfg.eventId||'default');state=old?.eventId===id&&Array.isArray(old.tiles)&&old.tiles.length===10&&Array.isArray(old.used)?old:{eventId:id,sheet:0,tiles:[],used:[],pending:null};if(!state.tiles.length)newSheet();render();if(state.tiles.every(t=>t.done))finishSheet();window.addEventListener('pageshow',e=>{if(e.persisted)returned()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&away)returned()});window.addEventListener('focus',()=>{if(away)returned()});if(performance.getEntriesByType('navigation')[0]?.type==='back_forward')returned()}catch(e){notice('SETUP REQUIRED','config.json と管理画面の画像APIを確認してください。');console.error(e)}}init()})();
</script></body></html>
